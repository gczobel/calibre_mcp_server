name: CodeQL

on:
  push:
    branches: [main]
  # Any base branch, for the same reason `test` runs on any base branch: a
  # stacked pull request targets another pull request's branch rather than
  # `main`, and filtering this trigger to `main` left it with no analysis at all.
  pull_request: {}
  schedule:
    # Weekly, so a new query pack is picked up without any code change.
    - cron: '0 6 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'actions']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
