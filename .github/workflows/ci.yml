name: CI

# Whether this run may publish. The GHCR login and the image push both read this
# one value, so the two can never disagree about whether the run publishes.
#
# Gated on the ref and not only on the event, because `workflow_dispatch` can be
# pointed at any branch: an event-only gate published `:latest` from whatever
# branch a dispatch named, and the homelab pulls `:latest`, so a stray dispatch
# would have replaced the deployed server with unreviewed code. A dispatch on a
# branch still builds the image, which is the useful half.
#
# Compared against the string 'true' on purpose. Workflow env is text, and a
# value fed to a boolean field is a non-empty string, so `if: env.PUBLISH_IMAGE`
# would be true while holding 'false' — the trap the concurrency group below
# fell into.
env:
  PUBLISH_IMAGE: >-
    ${{ github.event_name != 'pull_request'
    && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rebuilt base image is picked up even with no code change.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# A superseded pull request run is wasted work, so cancel it. A push to main or a
# tag gets its own group keyed on the commit, so it can never cancel another run:
# those are the runs that publish the image, and a cancelled one leaves `latest`
# silently pointing at an older commit.
#
# The group does the work rather than the boolean below. `cancel-in-progress` fed
# an expression appears to be read as a non-empty string, which is true, so it
# cancelled a main push regardless of the condition.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      # Guards against a dependency bump that updates pyproject.toml without
      # uv.lock, which would otherwise surface as a confusing failure later.
      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Run tests
        run: uv run pytest

  # Gated on `test`, so only a green commit becomes an image. On a pull request
  # this builds without pushing, which catches a broken Dockerfile before merge.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # A run that will not push has no use for credentials.
      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          # Pull the base image every run. The weekly schedule exists to pick up
          # base-image updates, since the only source being built is this commit.
          pull: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
