name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # Any base branch on purpose. A stacked pull request targets another pull
  # request's branch rather than `main`, and filtering this trigger to `main`
  # meant such a pull request ran nothing at all: no `test`, no `publish`. The
  # failure was quiet, since a required check that never reports has no failed
  # check to notice, only `Expected — Waiting for status to be reported`.
  pull_request: {}
  schedule:
    # Weekly, so a rebuilt base image is picked up even with no code change.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# A superseded pull request run is wasted work, so cancel it. A push to main or a
# tag gets its own group keyed on the commit, so it can never cancel another run:
# those are the runs that publish the image, and a cancelled one leaves `latest`
# silently pointing at an older commit.
#
# The group does the work rather than the boolean below. `cancel-in-progress` fed
# an expression appears to be read as a non-empty string, which is true, so it
# cancelled a main push regardless of the condition.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # A full version, not a major tag: setup-uv publishes no `v10`, so `@v10`
        # resolves to nothing. v10.1.0 is inside the 7-day cooldown in
        # dependabot.yml; v10.0.1 is the newest release past it.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Explicit, not the `auto` default: from v10, `auto` skips tag pushes,
          # and this workflow runs on `v*` tags. The cache is worth about a
          # second on this job either way; this keeps it doing what it did
          # before the bump, for the price of one line.
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      # Guards against a dependency bump that updates pyproject.toml without
      # uv.lock, which would otherwise surface as a confusing failure later.
      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Run tests
        run: uv run pytest

  # Gated on `test`, so only a green commit becomes an image. On a pull request
  # this builds without pushing, which catches a broken Dockerfile before merge.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Whether this run may publish. The GHCR login and the image push both read
    # this one value, so the two can never disagree about whether the run
    # publishes.
    #
    # Gated on the ref and not only on the event, because `workflow_dispatch` can
    # be pointed at any branch: an event-only gate published `:latest` from
    # whatever branch a dispatch named, and the homelab pulls `:latest`, so a
    # stray dispatch would have replaced the deployed server with unreviewed
    # code. A dispatch on a branch still builds the image, which is the half
    # worth keeping.
    #
    # Compared against the string 'true' on purpose. Environment values are text,
    # and a non-empty string fed to a boolean field is true, so `if:
    # env.PUBLISH_IMAGE` would be true while holding 'false' — the trap the
    # concurrency group above fell into.
    env:
      PUBLISH_IMAGE: >-
        ${{ github.event_name != 'pull_request'
        && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # A run that will not push has no use for credentials.
      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          # Pull the base image every run. The weekly schedule exists to pick up
          # base-image updates, since the only source being built is this commit.
          pull: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
